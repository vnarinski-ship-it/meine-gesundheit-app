name: Build OCR Hub APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "ocr-hub/**"
      - ".github/workflows/build-ocr-hub.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ocr-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build OCR Hub debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload OCR Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: ocr-hub-debug-apk
          path: ocr-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
